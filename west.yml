# West manifest for the SilverSat flight software workspace.
#
# This repository is the manifest repository (west "T2" topology). Running
# `west update` fetches Zephyr and its modules as SIBLINGS of this directory:
#
#   workspace/
#   ├── app/        <- this repository
#   ├── zephyr/     <- fetched by west, not version controlled here
#   └── modules/    <- fetched by west, not version controlled here
#
manifest:
  # Projects in the cpb group are fetched only after `make cpb-setup`, so
  # only builds for that board pay for them.
  group-filter: [-cpb]

  remotes:
    - name: upstream
      url-base: https://github.com/zephyrproject-rtos

  projects:
    - name: zephyr
      remote: upstream
      # Pinned deliberately. Do NOT track main -- upstream changes will break
      # student CI on days unrelated to anything they did. Bump this on
      # purpose, in its own pull request, and read the release notes.
      # Check https://github.com/zephyrproject-rtos/zephyr/releases for tags.
      revision: v4.4.0
      import:
        # Only the modules the builds use: the STM32 HAL and CMSIS for the
        # Nucleo. native_sim needs none. An allowlist rather than a
        # blocklist, so a new upstream module is not fetched by default;
        # that keeps every cold `west update`, in CI and in a new Codespace,
        # short. A new board or library may need a module added here.
        name-allowlist:
          - cmsis_6
          - hal_stm32

    # The Nordic HAL, for the Circuit Playground Bluefruit (docs/cpb.md). It
    # is about 300 MB, so it's in a group of its own. The revision is the
    # one Zephyr's own west.yml gives at the tag above: keep them the same
    # when bumping Zephyr.
    - name: hal_nordic
      remote: upstream
      revision: 44fd3d44b15cb75f80a25b4679f91d2787e28664
      path: modules/hal/nordic
      groups:
        - cpb

  self:
    # Must match the directory name in every environment. Codespaces clones
    # to /workspaces/silversat-fsw, so CI checks out to the same name.
    path: silversat-fsw
