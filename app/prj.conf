CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# The main thread runs the FRAM service's start and health's boot handling
# (SYS_INIT), which read and write FRAM before any app's thread starts. A
# FRAM write through the SPI driver needs more than the 1 KB default: with
# the flatsat's FRAM fitted, 1 KB overflowed at boot. App stacks are in
# include/silversat/resource_map.h (DS-07); this one is Zephyr's.
CONFIG_MAIN_STACK_SIZE=2048

CONFIG_SPI=y

# Useful while developing; revisit before anything flies.
CONFIG_ASSERT=y
CONFIG_THREAD_NAME=y

# Flight software apps (DS-10). The frame manager drives the rest.
CONFIG_SS_MESSAGES=y
CONFIG_SS_FRAME_MANAGER=y
CONFIG_SS_COMMAND_INGEST=y
CONFIG_SS_RADIO=y
CONFIG_SS_TELEMETRY_OUTPUT=y
CONFIG_SS_MODE_MANAGER=y
CONFIG_SS_HEALTH=y

# The FRAM service (DS-70). With no fram alias (the Nucleo, until a part is
# chosen), every record reads as its default (DS-75).
CONFIG_SS_NVM=y
CONFIG_SS_NVM_APP=y
