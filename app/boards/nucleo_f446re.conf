# Nucleo-F446RE settings for the flight application.

# The FRAM service's mirror is a retained-RAM device on the backup SRAM
# (nucleo_f446re.overlay). It must start after Zephyr's STM32 driver has
# switched the backup SRAM on, whose priority is
# CONFIG_STM32_BACKUP_SRAM_INIT_PRIORITY (90, the default); Zephyr's
# start-up order check fails the build otherwise.
CONFIG_RETAINED_MEM_INIT_PRIORITY=91

# Keep the debug port alive while the CPU sleeps. Zephyr's idle thread
# sleeps (WFI) whenever no app is running, which is most of the time, and
# with this off the ST-LINK can't attach without resetting the board, so
# `make debug` on the flatsat is refused (DS-04). It costs a little power
# in sleep, which doesn't matter on the Nucleo.
CONFIG_STM32_ENABLE_DEBUG_SLEEP_STOP=y
