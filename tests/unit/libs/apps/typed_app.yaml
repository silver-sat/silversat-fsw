# Test-only app for the command routing tests: one command with every kind
# of argument, one with none, one allowed only in nominal mode, and one that
# only other apps may send.

app: typed_app
id: 50
description: Has a command for every kind of argument.
wakeup: false

commands:
  - name: set_all
    id: 1
    description: Every argument kind, in order.
    modes: [safe, nominal]
    fields:
      - {name: u8, type: uint8}
      - {name: u16, type: uint16}
      - {name: u32, type: uint32}
      - {name: u64, type: uint64}
      - {name: i8, type: int8}
      - {name: i16, type: int16}
      - {name: i32, type: int32}
      - {name: i64, type: int64}
      - {name: flag, type: bool}
      - {name: mode, type: mode}
  - name: ping
    id: 2
    description: No arguments.
    modes: [safe, nominal]
  - name: nominal_only
    id: 3
    description: Allowed only in nominal mode.
    modes: [nominal]
    fields:
      - {name: level, type: uint8}
  - name: internal_only
    id: 4
    internal: true
    description: Sent only by other apps; the ground can't.
    fields:
      - {name: level, type: uint8}

# Events, one with each kind of argument and one with none (DS-10).
events:
  - name: typed
    id: 1
    severity: warning
    description: An event with an app argument and an enum argument.
    args:
      - name: who
        type: app
        description: An app.
      - name: mode
        type: mode
        description: A mode.
  - name: plain
    id: 513
    severity: critical
    description: An event with a plain number and nothing else.
    args:
      - name: count
        description: A number.
  - name: bare
    id: 65535
    severity: debug
    description: An event with no arguments, and the largest id.

# Housekeeping with every field type, for the telemetry encoder tests.
housekeeping:
  description: Typed app state.
  fields:
    - {name: commands, type: uint32}
    - {name: u8, type: uint8}
    - {name: u16, type: uint16}
    - {name: u32, type: uint32}
    - {name: u64, type: uint64}
    - {name: i8, type: int8}
    - {name: i16, type: int16}
    - {name: i32, type: int32}
    - {name: i64, type: int64}
    - {name: flag, type: bool}
    - {name: mode, type: mode}
    - {name: f32, type: float32}
    - {name: f64, type: float64}
