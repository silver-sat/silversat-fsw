# Housekeeping vectors, shared by the flight encoder (src/tlm_encode.c) and
# the ground decoder (tools/tests/test_telemetry.py). Python encodes each;
# the C encoder must produce the same bytes.

vectors:
  - name: zeros
    app: typed_app
    met_ms: 0
    values: {commands: 0, u8: 0, u16: 0, u32: 0, u64: 0, i8: 0, i16: 0, i32: 0, i64: 0,
             flag: false, mode: safe, f32: 0.0, f64: 0.0}
  - name: maximums
    app: typed_app
    met_ms: 1790812800000
    values: {commands: 4294967295, u8: 255, u16: 65535, u32: 4294967295,
             u64: 18446744073709551615, i8: 127, i16: 32767, i32: 2147483647,
             i64: 9223372036854775807, flag: true, mode: nominal, f32: 1.5, f64: 1.0e+300}
  - name: minimums
    app: typed_app
    met_ms: -1
    values: {commands: 1, u8: 1, u16: 258, u32: 16909060, u64: 72623859790382856,
             i8: -128, i16: -32768, i32: -2147483648, i64: -9223372036854775808,
             flag: true, mode: safe, f32: -0.25, f64: -2.5}
