# Test-only app for the command routing tests: one command with every kind
# of argument, one with none, and one allowed only in nominal mode.

app: typed_app
id: 150
description: Has a command for every kind of argument.
wakeup: false

commands:
  - name: set_all
    id: 1
    description: Every argument kind, in order.
    modes: [safe, nominal]
    fields:
      - {name: u8, type: uint8}
      - {name: u16, type: uint16}
      - {name: u32, type: uint32}
      - {name: u64, type: uint64}
      - {name: i8, type: int8}
      - {name: i16, type: int16}
      - {name: i32, type: int32}
      - {name: i64, type: int64}
      - {name: flag, type: bool}
      - {name: mode, type: mode}
  - name: ping
    id: 2
    description: No arguments.
    modes: [safe, nominal]
  - name: nominal_only
    id: 3
    description: Allowed only in nominal mode.
    modes: [nominal]
    fields:
      - {name: level, type: uint8}

housekeeping:
  description: Typed app state.
  fields:
    - {name: commands, type: uint32}
