CONFIG_ZTEST=y

CONFIG_SS_CMD_AUTH=y
CONFIG_SS_CMD_COUNTER=y
CONFIG_SS_MESSAGES=y
CONFIG_SS_CMD_ROUTES=y

# typed_app's set_all command is bigger than the default zbus buffer; the
# generated size check in msg_typed_app.c says so if this is too small.
CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_STATIC_DATA_SIZE=64

# typed_app on top of the flight apps needs a bigger pool than the
# default; resource_map.h's check fails the build if this is too small.
CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_POOL_SIZE=24
