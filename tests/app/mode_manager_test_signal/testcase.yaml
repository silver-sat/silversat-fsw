common:
  tags:
    - app
    - mode

tests:
  # The ground leaves test mode for nominal.
  app.mode_manager_test_signal:
    platform_allow:
      - native_sim
      - native_sim/native/64
  # The ground leaves test mode for safe. One platform keeps CI short.
  app.mode_manager_test_signal.to_safe:
    extra_args:
      - EXTRA_CFLAGS=-DLEAVE_TEST_FOR=MODE_SAFE
    platform_allow:
      - native_sim
  # A later boot, after deployment: it starts in safe mode, and the signal
  # still selects test mode.
  app.mode_manager_test_signal.deployed:
    extra_args:
      - EXTRA_CFLAGS=-DDEPLOYED
    platform_allow:
      - native_sim
