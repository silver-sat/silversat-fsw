CONFIG_ZTEST=y

CONFIG_SS_MESSAGES=y
CONFIG_SS_HEALTH=y
# A second flight app's thread, for the stack high-water marks (DS-44).
CONFIG_SS_NVM_APP=y

# Test apps on top of the flight apps need a bigger pool than the
# default; resource_map.h's check fails the build if this is too small.
CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_POOL_SIZE=64

# The fake FRAM and mirror (app.overlay).
CONFIG_EEPROM=y
CONFIG_RETAINED_MEM=y
