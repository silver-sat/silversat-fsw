CONFIG_ZTEST=y

CONFIG_SS_MESSAGES=y
CONFIG_SS_HEALTH=y

# A test app on top of the flight apps needs a bigger pool than the
# default; resource_map.h's check fails the build if this is too small.
CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_POOL_SIZE=44

# The fake FRAM and mirror (app.overlay).
CONFIG_EEPROM=y
CONFIG_RETAINED_MEM=y
