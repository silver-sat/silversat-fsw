common:
  tags:
    - app
    - health

tests:
  app.health:
    platform_allow:
      - native_sim
      - native_sim/native/64
  # A protected app's stall stops the watchdog for good, so it needs its own
  # boot. One platform keeps CI short.
  app.health.protected_stall:
    extra_args:
      - EXTRA_CFLAGS=-DPROTECTED_STALL
    platform_allow:
      - native_sim
  # The boot after an earlier run: the checkpoint it left is carried on.
  app.health.after_reset:
    extra_args:
      - EXTRA_CFLAGS=-DAFTER_RESET
    platform_allow:
      - native_sim
  # Two boot logs showing a reset loop (DS-44): at the safe-mode threshold,
  # and longer than the stop threshold (7 short runs, counted up to 6).
  app.health.reset_loop_safe:
    extra_args:
      - EXTRA_CFLAGS=-DAFTER_RESET -DRESET_LOOP=3
    platform_allow:
      - native_sim
  app.health.reset_loop_stop:
    extra_args:
      - EXTRA_CFLAGS=-DAFTER_RESET -DRESET_LOOP=7
    platform_allow:
      - native_sim
