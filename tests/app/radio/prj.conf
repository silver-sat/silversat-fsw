# The flight path for ground commands and telemetry: radio, command
# ingest, telemetry output, and the frame manager that wakes them, with the
# flight frame tables. The mode manager boots into test mode, as on the
# bench: the test signal is present (app.overlay), so there is no
# separation delay (DS-42).
CONFIG_SS_MESSAGES=y
CONFIG_SS_FRAME_MANAGER=y
CONFIG_SS_COMMAND_INGEST=y
CONFIG_SS_RADIO=y
CONFIG_SS_TELEMETRY_OUTPUT=y
CONFIG_SS_MODE_MANAGER=y

# A Python simulator on the other end of the UART runs in real time, so
# the spacecraft must too (DS-92).
CONFIG_NATIVE_SIM_SLOWDOWN_TO_REAL_TIME=y

CONFIG_PRINTK=y
