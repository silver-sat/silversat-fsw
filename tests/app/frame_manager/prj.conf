CONFIG_ZTEST=y
CONFIG_ASSERT=y

CONFIG_SS_MESSAGES=y
CONFIG_SS_FRAME_MANAGER=y
# src/test_tables.c defines frame_tables[] instead.
CONFIG_SS_FRAME_MANAGER_FLIGHT_TABLES=n

# Two test apps on top of the flight apps need a bigger pool than the
# default; resource_map.h's check fails the build if this is too small.
CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_POOL_SIZE=32
