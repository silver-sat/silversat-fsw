# FRAM region map (DS-71, DS-74, DS-75).
#
# Every record in FRAM is defined here, once. The generator (msggen.py)
# lays the regions out in order, checks they fit, and writes for each owner
# nvm/<owner>.h: the record's struct, its encoding, its flash default, and
# the region handle, which only the owner includes. Nobody assigns
# addresses by hand, and only the owner writes its records.
#
# Each record is stored twice (two slots) with a header and a CRC, so a
# write torn by a power failure never loses the previous value. A record
# that can't be read, because FRAM is blank, corrupt or missing, reads as
# its default (DS-75). Change a record's fields only with a new version:
# a stored record of another version reads as the default.
#
# Field types are those of the message definitions: bool, uint8 to uint64,
# int8 to int64, or an enum from common.yaml. Each field may give a
# default; otherwise it defaults to 0, false, or the enum's first value.
#
# mirror: true also keeps a record in the mirror, a small memory that
# survives a reset (the STM32's backup SRAM), as DS-75's second tier: the
# small records that matter most if FRAM fails, or isn't fitted yet.
#
# ring: N makes a ring of N entries, each written once at its number modulo
# N, over the entry N before it (DS-71's boot log). A ring can be mirrored
# too: the whole ring is then kept in both.

# Until the part is chosen, a 256 Kbit SPI FRAM (for example, Infineon
# FM25V02A or Fujitsu MB85RS256).
fram_size: 32768

# The STM32F446's backup SRAM.
mirror_size: 4096

regions:
  - name: command_state
    owner: command_ingest
    version: 1
    mirror: true
    description: >
      The command counter floor for each key slot, the active key slot,
      and the last ground contact (DS-46, DS-53, DS-54). Written when a
      command is accepted, before its ACK.
    fields:
      - name: floor_slot0
        type: uint64
        default: 1767225600000   # CMD_COUNTER_EPOCH_MS, the mission epoch
        description: Key slot 0's counter floor.
      - name: floor_slot1
        type: uint64
        default: 1767225600000
        description: Key slot 1's counter floor.
      - name: active_slot
        type: uint8
        description: The key slot in use (DS-54).
      - name: contacted
        type: bool
        description: True once the ground has been heard from (DS-46).
      - name: last_accepted_met_ms
        type: int64
        description: Mission elapsed time of the last accepted command.

  - name: mode_state
    owner: mode_manager
    version: 1
    mirror: true
    description: The current mode and why, so safe mode survives a reset (DS-41).
    fields:
      - name: mode
        type: mode
        default: safe
        description: The mode when last changed.
      - name: reason
        type: mode_reason
        description: Why the spacecraft entered it.

  - name: deployment
    owner: mode_manager
    version: 1
    mirror: true
    description: >
      Whether the separation delay is over, so deploy mode is used only
      once in the mission (DS-42, DS-45).
    fields:
      - name: complete
        type: bool
        description: True once the separation delay has ended.

  - name: radio_state
    owner: radio
    version: 1
    mirror: true
    description: >
      Whether the ground has stopped transmission, so a reset doesn't turn
      it back on (DS-33, DS-46).
    fields:
      - name: transmit_enabled
        type: bool
        default: true
        description: False while transmission is stopped by set_transmit.

  - name: run_checkpoint
    owner: health
    version: 1
    mirror: true
    description: >
      Where this run has got to, written every major frame (DS-25, DS-44,
      DS-72): the boot number, mission elapsed time, and this boot's uptime,
      so the next boot carries MET on and knows how long this run lasted.
    fields:
      - name: boot_number
        type: uint32
        description: Boots since the record was blank, this one included.
      - name: met_ms
        type: int64
        description: Mission elapsed time at the checkpoint.
      - name: uptime_ms
        type: int64
        description: Time since this boot at the checkpoint.
      - name: reset_app
        type: uint8
        description: >
          The protected app whose stall made health stop feeding the
          watchdog (enum app_id), or 0. Stored as soon as health decides, so
          the next boot can log it (DS-44).

  - name: boot_log
    owner: health
    version: 1
    ring: 16
    mirror: true
    description: >
      One entry per boot, the last 16 boots (DS-44, DS-71). Entry n is at
      n % 16; its number is the boot number. Mirrored, so the history
      survives FRAM failing, or not being fitted yet.
    fields:
      - name: reset_cause
        type: uint32
        description: Why the last run ended, as Zephyr's hwinfo reset cause flags (RESET_*).
      - name: previous_run_ms
        type: int64
        description: How long the last run lasted, to its last checkpoint.
      - name: met_at_boot_ms
        type: int64
        description: Mission elapsed time when this boot began.
      - name: reset_app
        type: uint8
        description: The protected app whose stall caused the reset, or 0 (DS-44).
