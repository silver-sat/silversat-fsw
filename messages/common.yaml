# Shared message types (DS-68).
#
# Everything here is emitted into msg/common.h, which every app may include.
# Keep this file small: a type belongs here only if the framework itself
# depends on it (the frame tick, app status, events, the mode), or if it is
# carried on a data channel that other apps read. An app's own messages go
# in apps/<app>.yaml.
#
# The generator requires frame_tick and app_status: every app's wakeup and
# status channels carry them (DS-14, DS-25).

enums:
  - name: severity
    type: uint8
    description: How serious an event is. Telemetry output and the ground filter on it.
    values:
      - name: debug
        value: 0
        description: Development detail; not downlinked in the flight build.
      - name: info
        value: 1
        description: Normal operation worth recording (a mode change, a command accepted).
      - name: warning
        value: 2
        description: Something unexpected that the software handled.
      - name: error
        value: 3
        description: A fault; an app or device is degraded.
      - name: critical
        value: 4
        description: A fault that triggers recovery (disable, reset, or safe mode).

  - name: mode
    type: uint8
    description: >
      Spacecraft mode (DS-40, DS-41, DS-42). Each mode has its own frame
      table (DS-23). mode_chan starts as deploy (its initial value in
      apps/mode_manager.yaml), so a mode channel that has never been
      published reads as the most restrictive mode.
    values:
      - name: safe
        value: 0
        description: Trusted apps only. Any source may enter it; only a ground command leaves it.
      - name: nominal
        value: 1
        description: Normal operations.
      - name: deploy
        value: 2
        description: >
          After separation, until the deployment wait is over. Nothing that
          transmits runs, and no ground commands are accepted. Entered only
          at boot.
      - name: test
        value: 3
        description: >
          Ground testing, entered at boot by an external signal. Skips the
          deployment wait, doesn't deploy the antenna, and accepts ground
          commands.

  - name: mode_reason
    type: uint8
    description: Why the spacecraft entered its current mode (DS-41). Carried in the beacon (DS-69).
    values:
      - name: boot
        value: 0
        description: The mode in effect at boot, before the mode manager has decided.
      - name: ground_command
        value: 1
      - name: low_battery
        value: 2
      - name: reset_loop
        value: 3
      - name: app_failure
        value: 4
        description: A critical app failed (DS-43).
      - name: command_loss
        value: 5
        description: No ground command accepted within the timeout (DS-46).
      - name: deployment_complete
        value: 6
        description: The wait after separation is over (DS-42, DS-45).
      - name: test_signal
        value: 7
        description: The test signal was present at boot (DS-42).

structs:
  - name: frame_tick
    description: >
      Published by the frame manager to each app's wakeup channel (DS-21,
      DS-25). Apps timestamp their data from the tick, never by calling
      the clock.
    fields:
      - name: count
        type: uint32
        description: Minor frames since boot. At 10 Hz this wraps after about 13 years.
      - name: slot
        type: uint8
        description: Minor-frame slot within the major frame (count modulo the slot count).
      - name: uptime_ms
        type: int64
        description: Milliseconds since this boot. 64-bit, so it never wraps.
      - name: met_ms
        type: int64
        description: Mission elapsed time in milliseconds, carried across resets.

  - name: app_status
    description: >
      Published by every app on its status channel after each message it
      handles (DS-14). The frame manager compares steps with the wakeups it
      delivered to bound each app's pending wakeups (DS-22); health uses the
      same counts to detect a stalled app (DS-43).
    fields:
      - name: steps
        type: uint32
        description: Wakeups handled. Compare using unsigned subtraction, so a wrap is harmless.
      - name: cmd_accepted
        type: uint32
        description: Commands accepted.
      - name: cmd_rejected
        type: uint32
        description: Commands rejected.

  - name: mode_state
    description: >
      The current mode, published only by the mode manager on mode_chan
      (DS-40). The frame manager reads it to choose its frame table.
    fields:
      - name: mode
        type: mode
      - name: reason
        type: mode_reason
      - name: since_met_ms
        type: int64
        description: Mission elapsed time when this mode was entered.

  - name: frame_report
    description: >
      Published by the frame manager on frame_report_chan at the start of
      each major frame, for health (DS-43). Bit n of each mask is app n
      (enum app_id).
    fields:
      - name: major_frame
        type: uint32
        description: Major frames since boot, so a reader can tell a new report from an old one.
      - name: stuck
        type: uint64
        description: >
          Apps still not finished with the wakeups delivered before the last
          major frame began: a whole major frame behind.
      - name: disabled
        type: uint64
        description: Apps whose wakeups are stopped by set_app_enabled.

  - name: mission_time
    description: >
      Published by health on mission_time_chan before any app starts (DS-25,
      DS-72): this boot's number, and mission elapsed time when it began,
      carried on from the run before. The frame manager adds uptime to it
      for each tick's MET.
    fields:
      - name: boot_number
        type: uint32
        description: Boots so far, this one included; 0 if health doesn't run.
      - name: met_at_boot_ms
        type: int64
        description: Mission elapsed time when this boot began.

  - name: ground_contact
    description: >
      When the ground was last heard from, published by command ingest on
      ground_contact_chan each time it accepts a command. The mode manager
      reads it for the command-loss timer (DS-46).
    fields:
      - name: contacted
        type: bool
        description: >
          True once a command has been accepted since boot. The timer runs
          only after first contact.
      - name: last_accepted_met_ms
        type: int64
        description: Mission elapsed time when the last command was accepted.

  - name: event
    description: >
      One event message. Telemetry output attaches RTC time, so apps do not
      read the clock (DS-25).
    fields:
      - name: met_ms
        type: int64
        description: Mission elapsed time from the tick that was current when the event occurred.
      - name: app
        type: uint8
        description: The reporting app (enum app_id).
      - name: severity
        type: severity
      - name: id
        type: uint16
        description: Event number, unique within the reporting app.
      - name: arg0
        type: int32
        description: Event-specific detail.
      - name: arg1
        type: int32
        description: Event-specific detail.
