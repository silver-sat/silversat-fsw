# Frame manager messages (DS-20 to DS-25).
#
# The file name must match `app:`. From this file the generator emits
# msg/frame_manager.h and the app's channels:
#
#   frame_manager_cmd_chan     struct frame_manager_cmd  (commands below)
#   frame_manager_hk_chan      struct frame_manager_hk   (housekeeping below)
#   frame_manager_status_chan  struct app_status         (declared in msg/common.h)
#
# There is no wakeup channel: the frame manager is driven by its own timer.

app: frame_manager
id: 1
description: Drives all periodic work from a table of minor-frame slots.
wakeup: false

commands:
  - name: set_entry_enabled
    id: 1
    # Every mode with ground commands: disabling an app's wakeups is part of
    # recovery in safe mode.
    modes: [safe, nominal, test]
    description: >
      Enable or disable one entry in a frame table. Sets the state rather
      than toggling it (DS-35). Disabling an entry that belongs to a
      protected app is rejected (DS-23).
    fields:
      - name: mode
        type: mode
        description: The mode whose frame table holds the entry.
      - name: entry
        type: uint8
        description: Entry index within that table.
      - name: enabled
        type: bool
        description: True to deliver the entry's wakeups, false to stop.
  - name: set_app_enabled
    id: 2
    # Every mode with ground commands. Health sends it too (DS-43).
    modes: [safe, nominal, test]
    description: >
      Start or stop all of one app's wakeups, in every mode. Health stops a
      stalled app with this; the ground can start it again. Sets the state
      rather than toggling it (DS-35). Stopping a protected app is rejected
      (DS-23, DS-43).
    fields:
      - name: app
        type: uint8
        description: The app's id (enum app_id).
      - name: enabled
        type: bool
        description: True to deliver the app's wakeups, false to stop.

data_channels:
  - name: frame_report_chan
    type: frame_report
    description: Which apps are a major frame behind, and which are stopped, for health (DS-43).

housekeeping:
  description: Frame manager state, published at the start of every major frame.
  fields:
    - name: frame_count
      type: uint32
      description: Minor frames since boot (the tick count).
    - name: mode
      type: mode
      description: The mode whose frame table is in use.
    - name: overruns
      type: uint32
      description: Wakeups skipped because an app already had too many pending (DS-22).
    - name: missed_frames
      type: uint32
      description: Minor frames skipped because the frame manager itself fell behind.
    - name: publish_errors
      type: uint32
      description: Wakeups whose publish failed. Nonzero means the zbus pool is too small (DS-07).
    - name: rejected_bad_command
      type: uint32
      description: Commands rejected for an unknown command id.
    - name: rejected_bad_index
      type: uint32
      description: Commands rejected for a mode or entry outside the tables.
    - name: rejected_protected
      type: uint32
      description: Commands rejected for disabling a protected app's entry (DS-23).
    - name: disabled_apps
      type: uint64
      description: Apps whose wakeups set_app_enabled has stopped; bit n is app n.
