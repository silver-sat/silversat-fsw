# Mode manager messages (DS-40, DS-41, DS-46).
#
# The mode manager is the only publisher of mode_chan. It changes the mode
# when the ground commands it, when one of its own triggers fires (the
# command-loss timer), or when another app requests it (request_mode, an
# internal command: health, for a reset loop or a failed critical app).

app: mode_manager
id: 2
description: Sole publisher of the spacecraft mode.
# Frame-driven: it checks its triggers (the command-loss timer, and later
# low battery) every major frame (DS-41, DS-46).
wakeup: true

commands:
  - name: set_mode
    id: 1
    # Not in deploy, where no ground command is accepted (DS-42). The ground
    # leaves safe or test mode with this.
    modes: [safe, nominal, test]
    description: >
      Set the spacecraft mode. Sets the state rather than toggling it
      (DS-35): setting the current mode changes nothing. The only way out of
      safe mode (DS-41).
    fields:
      - name: mode
        type: mode
        description: The mode to enter.

  - name: request_mode
    id: 2
    # Only other apps send it (DS-40, DS-68); the ground uses set_mode.
    internal: true
    description: >
      Another app asks for a mode change because of a condition it detected
      (DS-40). Allowed only if the transitions table allows it for the
      reason. A request for safe mode while already in safe mode replaces
      the reason, so the ground sees the latest cause (DS-41).
    fields:
      - name: mode
        type: mode
        description: The mode to enter.
      - name: reason
        type: mode_reason
        description: >
          Why: low_battery, reset_loop or app_failure, conditions other apps
          detect. Any other reason is refused: the ground and the mode
          manager's own triggers give those.

# Actions the mode manager takes (DS-40), as internal commands.
sends:
  - radio.set_transmit

data_channels:
  - name: mode_chan
    type: mode_state
    description: The current mode. Published only by the mode manager (DS-40).
    # The boot mode (DS-42). The frame manager reads this before the mode
    # manager first publishes, so it must never be a mode that transmits.
    initial:
      mode: deploy
      reason: boot

housekeeping:
  description: Mode manager state, published at the start of every major frame and when it changes.
  fields:
    - name: mode
      type: mode
      description: The current mode.
    - name: reason
      type: mode_reason
      description: Why the spacecraft entered the current mode.
    - name: transitions
      type: uint32
      description: Mode changes since boot.
    - name: refused
      type: uint32
      description: >
        Mode changes refused because the transition table doesn't allow them
        (DS-40), and requests with a reason no app may give.
    - name: requests
      type: uint32
      description: >
        Requests from other apps that changed the mode, or the reason in safe
        mode (request_mode).
    - name: command_loss
      type: uint32
      description: Times the command-loss timer has fired (DS-46).
    - name: store_failures
      type: uint32
      description: Writes of mode_state or deployment that reached neither FRAM nor its mirror.
    - name: action_failures
      type: uint32
      description: >
        Actions whose internal command could not be sent. A trigger's
        actions are retried next major frame.
