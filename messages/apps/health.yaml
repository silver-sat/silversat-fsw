# Health messages (DS-43).
#
# Health watches every app's progress through the frame manager's report,
# stops a stalled app's wakeups, and is the only feeder of the hardware
# watchdog. When a protected app stalls, it stops feeding the watchdog, and
# the watchdog resets the spacecraft. At boot it counts short runs in the
# boot log; a reset loop asks for safe mode, and a long one also stops every
# app that isn't protected (DS-44). It restarts stopped apps whose re-enable
# policy is AUTO (DS-43), and reports each app thread's stack high-water
# mark (DS-44).

app: health
id: 6
description: Watches the apps and feeds the hardware watchdog.
# Woken once a major frame, in slot 0, to read the frame manager's report.
wakeup: true

# Its responses: stopping a stalled app (DS-43), and asking the mode manager
# for safe mode after a reset loop or a failed critical app (DS-40, DS-41,
# DS-44).
sends:
  - frame_manager.set_app_enabled
  - mode_manager.request_mode

data_channels:
  - name: mission_time_chan
    type: mission_time
    description: >
      This boot's number and MET at boot, published before any app thread
      starts (DS-25). All zeros without health: MET is then uptime.

# Events (DS-10): each response to a fault, as it happens (DS-43, DS-44).
events:
  - name: app_stalled
    id: 1
    severity: warning
    description: An app has been a whole major frame behind for its stall threshold (DS-43).
    args:
      - name: app
        type: app
        description: The stalled app.
  - name: app_stopped
    id: 2
    severity: warning
    description: Health told the frame manager to stop waking an app.
    args:
      - name: app
        type: app
        description: The app stopped.
      - name: cause
        description: 1 for a stall, 2 for a reset loop (DS-44).
  - name: reset_coming
    id: 3
    severity: critical
    description: >
      A protected app stalled, so health has stopped feeding the watchdog,
      which resets the spacecraft within seconds (DS-43).
    args:
      - name: app
        type: app
        description: The protected app that stalled.
  - name: reset_loop
    id: 4
    severity: error
    description: >
      The boot log shows enough short runs in a row to be a reset loop, so
      health asks for safe mode (DS-44).
    args:
      - name: short_runs
        description: Runs in a row that ended within the reset-loop time.
  - name: app_restarted
    id: 5
    severity: info
    description: Health started an AUTO app again after its cooldown (DS-43).
    args:
      - name: app
        type: app
        description: The app started.
      - name: restarts
        description: Its automatic restarts so far this boot, this one included.
  - name: auto_exhausted
    id: 6
    severity: warning
    description: >
      An AUTO app stalled again after using all its automatic restarts; it
      now waits for the ground (DS-43).
    args:
      - name: app
        type: app
        description: The app.
  - name: ground_restart
    id: 7
    severity: info
    description: >
      The ground started an app health had stopped, renewing its automatic
      restarts (DS-43).
    args:
      - name: app
        type: app
        description: The app.
  - name: stack_low
    id: 8
    severity: warning
    description: >
      An app's thread has had less than CONFIG_SS_STACK_MARGIN_BYTES of its
      stack unused; its stack size in the resource map should grow (DS-44).
    args:
      - name: app
        type: app
        description: The app with the least stack left.
      - name: unused
        description: Its stack bytes never used, at the time.

housekeeping:
  description: Health state, published every major frame.
  # Largest fields first (64-bit, then 32-bit, then bytes and flags), so the
  # C struct has no padding: it must fit the 64-byte zbus buffer every
  # message shares (DS-07), and with padding it wouldn't.
  fields:
    - name: disabled_by_health
      type: uint64
      description: >
        Apps health has stopped and that haven't been started again since;
        bit n is app n.
    - name: auto_exhausted
      type: uint64
      description: >
        AUTO apps that have used all their automatic restarts and now wait
        for the ground; bit n is app n. A ground restart clears its bit and
        renews its restarts.
    - name: feeds
      type: uint32
      description: Times health has fed the watchdog.
    - name: stalls
      type: uint32
      description: Stalls detected, each counted once when it reaches the app's threshold.
    - name: action_failures
      type: uint32
      description: >
        Times set_app_enabled or request_mode could not be sent; each is
        retried at the next major frame.
    - name: boot_number
      type: uint32
      description: This boot's number (DS-44).
    - name: reset_cause
      type: uint32
      description: Why the last run ended, as hwinfo reset cause flags (RESET_*).
    - name: store_failures
      type: uint32
      description: Checkpoints or boot log entries that reached neither FRAM nor its mirror.
    - name: mode_requests
      type: uint32
      description: Requests sent to the mode manager (request_mode).
    - name: auto_reenables
      type: uint32
      description: >
        Times health has started an app again after its cooldown, for apps
        whose re-enable policy is AUTO (DS-43).
    - name: stack_min_unused
      type: uint32
      description: That app's stack bytes never used since boot.
    - name: watchdog
      type: bool
      description: True if there is a hardware watchdog and health set it up.
    - name: reset_app
      type: uint8
      description: >
        The protected app whose stall made health stop feeding the
        watchdog, or 0. The watchdog resets the spacecraft soon after.
    - name: short_runs
      type: uint8
      description: >
        Runs in a row, up to this boot, that ended within the reset-loop
        time, from the boot log (DS-44). 0 if the last run was long.
    - name: stack_apps
      type: uint8
      description: App threads health found to read stack high-water marks from (DS-44).
    - name: stack_min_app
      type: uint8
      description: The app whose thread has the least stack never used, or 0 if none was found.
    - name: stack_low
      type: bool
      description: >
        True once any app's unused stack is below CONFIG_SS_STACK_MARGIN_BYTES:
        that app's stack size should grow.
