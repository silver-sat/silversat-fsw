# Telemetry output messages (DS-10, DS-69).
#
# Telemetry output sends housekeeping to the ground: once a major frame it
# takes the next app in turn, encodes that app's latest housekeeping
# (include/silversat/tlm_encode.h), and puts it in the downlink queue. Then
# it sends queued events as E packets (DS-10). The beacon (DS-69) comes
# later.

app: telemetry_output
id: 5
description: Sends each app's housekeeping to the ground, one app per major frame.
wakeup: true

housekeeping:
  description: Telemetry output state, published every major frame.
  fields:
    - name: sent
      type: uint32
      description: Housekeeping packets put in the downlink queue.
    - name: dropped
      type: uint32
      description: Packets lost because the downlink queue was full.
    - name: encode_errors
      type: uint32
      description: >
        Housekeeping turns skipped because an app's housekeeping could not be
        read or encoded, and events that could not be encoded.
    - name: events_sent
      type: uint32
      description: Event packets put in the downlink queue (DS-10).
    - name: events_lost
      type: uint32
      description: Events taken from the event queue but lost because the downlink queue filled.
    - name: events_dropped
      type: uint32
      description: >
        Events dropped because the event queue was full when they were raised,
        since boot (silversat/event.h).
