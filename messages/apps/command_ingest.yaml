# Command ingest messages (DS-50, DS-53, DS-54).
#
# Its housekeeping counts each stage of the pipeline, so the ground can see
# where commands are being lost.

app: command_ingest
id: 3
description: Authenticates, checks, and routes ground commands.
# Woken every minor frame to empty the uplink queue.
wakeup: true

# Key rotation (DS-54): switch to the other key slot, arm then fire. Both
# commands must be signed with the key of the slot being switched to, so
# rotation works even when the active slot's floor is maxed out (DS-53).
# Command ingest handles these itself: only it knows which key signed a
# command.
commands:
  - name: arm_key_rotation
    id: 1
    description: >
      Arm a switch to the given key slot. Must be signed with that slot's
      key. The arm lasts 10 minutes of mission elapsed time.
    modes: [safe, nominal, test]
    fields:
      - name: slot
        type: uint8
        description: The slot to switch to; the slot whose key signed this command.
  - name: rotate_key
    id: 2
    description: >
      Switch to the armed key slot. Must be signed with that slot's key,
      within 10 minutes of the arm. No counter floor is reset (DS-53).
    modes: [safe, nominal, test]
    fields:
      - name: slot
        type: uint8
        description: The armed slot.

data_channels:
  - name: ground_contact_chan
    type: ground_contact
    description: >
      When a command was last accepted, for the mode manager's command-loss
      timer (DS-46). Published each time a command is accepted.

# Events (DS-10, DS-50): each rejection stage, routing rejections, and key
# rotation (DS-54). Anyone with a transmitter can cause the first five, so
# they are limited (command_ingest.c): the first is an event at once, and
# while more keep coming, one event each CONFIG_SS_CMD_REJECT_EVENT_SECONDS
# carries how many there were.
events:
  - name: rejected_shape
    id: 1
    severity: info
    description: >
      Uplink frames that aren't a signed command at all (stage 1): radio
      noise, or someone else's traffic.
    args:
      - name: count
        description: Frames rejected since this event was last raised, this one included.
  - name: rejected_signature
    id: 2
    severity: warning
    description: >
      Commands whose signature verifies with neither key (stage 2): a forgery,
      or a ground station using the wrong key.
    args:
      - name: count
        description: Commands rejected since this event was last raised, this one included.
  - name: rejected_other_key
    id: 3
    severity: warning
    description: >
      Commands signed with the spare key that weren't key rotation commands,
      which is all that key may sign (DS-54).
    args:
      - name: count
        description: Commands rejected since this event was last raised, this one included.
  - name: rejected_replay
    id: 4
    severity: warning
    description: >
      Commands whose counter wasn't above the floor (stage 3): a replay of a
      recorded command, or a ground retry of one already accepted (DS-53).
    args:
      - name: count
        description: Commands rejected since this event was last raised, this one included.
      - name: slot
        description: The key slot that signed the last of them.
  - name: rejected_jump
    id: 5
    severity: warning
    description: >
      Commands whose counter jumped too far above the floor (stage 3, DS-53).
    args:
      - name: count
        description: Commands rejected since this event was last raised, this one included.
      - name: slot
        description: The key slot that signed the last of them.
  - name: rejected_route
    id: 6
    severity: info
    description: >
      An authenticated command that couldn't be routed (stages 5 to 7). Its
      reply says why too.
    args:
      - name: app
        type: app
        description: The app the command named, or 0 if there is no such app.
      - name: result
        description: >
          Why (enum cmd_route_result, silversat/cmd_route.h): 1 bad_syntax,
          2 unknown_app, 3 unknown_command, 4 bad_arg_count, 5 mode,
          6 bad_arg, 7 busy, 8 publish_failed.
  - name: rotation_armed
    id: 7
    severity: info
    description: A key rotation to the spare slot was armed (DS-54).
    args:
      - name: slot
        description: The slot it will switch to.
  - name: key_rotated
    id: 8
    severity: warning
    description: The active key slot changed (DS-54).
    args:
      - name: slot
        description: The key slot now in use.
  - name: rotation_expired
    id: 9
    severity: info
    description: An armed key rotation lapsed without being fired (DS-54).
    args:
      - name: slot
        description: The slot it would have switched to.

housekeeping:
  description: Command ingest state, published after every minor frame that handled a frame.
  fields:
    - name: received
      type: uint32
      description: Uplink frames taken from the queue.
    - name: rejected_shape
      type: uint32
      description: Frames that failed the shape check (DS-50 stage 1). No reply is sent.
    - name: rejected_signature
      type: uint32
      description: Frames whose tag did not verify (stage 2). No reply is sent.
    - name: rejected_replay
      type: uint32
      description: Counters not above the floor (stage 3).
    - name: rejected_jump
      type: uint32
      description: Counters too far above the floor (stage 3, DS-53).
    - name: store_failures
      type: uint32
      description: >
        Writes of command_state that reached neither FRAM nor its mirror. The
        floor is kept in RAM for the rest of the boot (DS-75).
    - name: rejected_route
      type: uint32
      description: Accepted commands that failed decoding or routing (stages 6 and 7).
    - name: routed
      type: uint32
      description: Commands delivered to their target app.
    - name: replies_dropped
      type: uint32
      description: Replies lost because the downlink queue was full.
    - name: rejected_other_key
      type: uint32
      description: Commands signed with the spare key that were not rotation commands (DS-54).
    - name: rotations
      type: uint32
      description: Key rotations since boot.
    - name: active_slot
      type: uint8
      description: The key slot in use, kept in FRAM and its mirror across a reset (DS-54).
    - name: rotation_armed
      type: bool
      description: A rotation is armed and has not expired.
    - name: last_counter
      type: uint64
      description: The counter of the last accepted command; the ground's next must be higher.
    - name: last_accepted_met_ms
      type: int64
      description: When the last command was accepted, for the command-loss timer (DS-46).
