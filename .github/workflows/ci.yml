name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * *'        # 02:17 ET, off the hour so it isn't queued behind everyone else's midnight jobs
  workflow_dispatch:

# Cancel only in-progress runs for pull requests, not for pushes to main or scheduled runs.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The emulated tests, in four jobs in parallel: each native_sim platform,
  # in two halves (twister --subset). Each build spends about a minute in
  # CMake configuration, which no compiler cache speeds up, so the way to a
  # short run is fewer builds per job. Nothing is left out: together the
  # four jobs run every test on both platforms.
  native_sim_platform:
    name: native_sim tests (${{ matrix.width }}, part ${{ matrix.part }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        width: [32-bit, 64-bit]
        part: [1, 2]
        include:
          - width: 32-bit
            platform: native_sim
          - width: 64-bit
            platform: native_sim/native/64
    env:
      ZEPHYR_TOOLCHAIN_VARIANT: zephyr

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # MUST match `self: path:` in west.yml.
          path: silversat-fsw

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install 32-bit host libraries
        # Needed only for the default (32-bit) native_sim target.
        if: matrix.platform == 'native_sim'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib

      - name: Set up Zephyr workspace
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: silversat-fsw
          # Not used by native_sim (which builds with the host compiler),
          # but cached here so the target-build job below is fast.
          toolchains: arm-zephyr-eabi
          # Each job builds different code, so each keeps its own compiler
          # cache; sharing one key restored another job's cache, all misses.
          ccache-cache-key: native-sim-tests-${{ matrix.width }}-part-${{ matrix.part }}
          ccache-max-size: 1GB

      - name: Install message generator requirements
        run: pip install -r silversat-fsw/messages/requirements.txt

      - name: Run the Python tests
        # Once is enough: they don't depend on the platform.
        if: matrix.platform == 'native_sim/native/64' && matrix.part == 1
        working-directory: silversat-fsw
        run: make test-python

      - name: Run twister
        working-directory: silversat-fsw
        run: make twister PLATFORMS=${{ matrix.platform }} SUBSET=${{ matrix.part }}/2

      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: twister-results-${{ matrix.width }}-part-${{ matrix.part }}
          path: |
            silversat-fsw/twister-out/twister.xml
            silversat-fsw/twister-out/twister.log
          retention-days: 7
          if-no-files-found: ignore

  # The check the branch rules require is named "native_sim tests". This job
  # carries that name and passes only if all four jobs passed, so the rules
  # don't change when the jobs do.
  native_sim:
    name: native_sim tests
    needs: native_sim_platform
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Every platform passed
        run: test "${{ needs.native_sim_platform.result }}" = success

  # Coverage runs in its own job rather than inside `make test` (DS-05).
  # Coverage instrumentation slows every build and doesn't mix well with
  # the sanitizers, so `make test` stays fast and `make coverage` runs
  # here in parallel. 64-bit only, so no 32-bit host libraries needed.
  coverage:
    name: native_sim coverage
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      ZEPHYR_TOOLCHAIN_VARIANT: zephyr

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: silversat-fsw

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Zephyr workspace
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: silversat-fsw
          toolchains: arm-zephyr-eabi
          # Each job builds different code, so each keeps its own compiler
          # cache; sharing one key restored another job's cache, all misses.
          ccache-cache-key: native-sim-coverage
          ccache-max-size: 1GB

      - name: Install message generator requirements
        run: pip install -r silversat-fsw/messages/requirements.txt

      - name: Run twister with coverage
        working-directory: silversat-fsw
        run: make coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: silversat-fsw/twister-out/coverage/
          retention-days: 14

  build_target:
    name: nucleo_f446re build
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: silversat-fsw

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Zephyr workspace
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: silversat-fsw
          toolchains: arm-zephyr-eabi
          # Each job builds different code, so each keeps its own compiler
          # cache; sharing one key restored another job's cache, all misses.
          ccache-cache-key: nucleo-build
          ccache-max-size: 256MB

      - name: Install message generator requirements
        run: pip install -r silversat-fsw/messages/requirements.txt

      - name: Build application
        working-directory: silversat-fsw
        run: make build

      - name: Report footprint
        working-directory: silversat-fsw
        run: |
          arm-zephyr-eabi-size build/zephyr/zephyr.elf || \
            size build/zephyr/zephyr.elf

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: zephyr-nucleo_f446re
          path: silversat-fsw/build/zephyr/zephyr.elf
          retention-days: 7

  compliance:
    name: compliance
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: silversat-fsw
          # Compliance diffs against the base branch, so the default
          # shallow clone is not enough.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Zephyr workspace
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: silversat-fsw
          toolchains: arm-zephyr-eabi

      - name: Install compliance requirements
        run: pip install -r zephyr/scripts/requirements-compliance.txt

      - name: Run compliance checks
        working-directory: silversat-fsw
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          python ../zephyr/scripts/ci/check_compliance.py \
            -m Kconfig -m DevicetreeBindings -m DevicetreeLinting -m YAMLLint \
            -c "origin/$BASE_REF..HEAD"

  flatsat:
    name: flatsat (HIL)
    needs: [build_target]

    # Two gates. The repository variable is the master switch -- set
    # FLATSAT_ENABLED to "true" in Settings -> Secrets and variables ->
    # Actions -> Variables when the rig is up. The second condition keeps
    # fork pull requests off the hardware: a fork PR can run arbitrary
    # code, and this job joins the tailnet.
    if: >-
      vars.FLATSAT_ENABLED == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)

    # Deliberately the OPPOSITE of the workflow-level setting: one board
    # means runs must QUEUE, not cancel each other. The group is keyed on
    # the hardware, not the branch, so every trigger shares one lane.
    concurrency:
      group: flatsat-nucleo-f446re
      cancel-in-progress: false

    # Informational until the rig has earned trust. A flaky required check
    # that blocks ten students will teach them to ignore CI. Remove this
    # line -- and add the job to the ruleset -- after a couple of weeks of
    # clean nightly runs.
    continue-on-error: true

    # id-token lets the Tailscale action ask GitHub for a token proving
    # this is this repository's workflow (workload identity federation),
    # so there is no tailnet secret to store or rotate. Setting permissions
    # here turns the rest off for this job.
    permissions:
      contents: read
      id-token: write

    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: silversat-fsw

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install host-side tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gdb-multiarch

      - name: Download firmware
        uses: actions/download-artifact@v7
        with:
          name: zephyr-nucleo_f446re
          path: fw

      # The flatsat is an Ubuntu box on the tailnet (docs/flatsat.md).
      # tag:ci may reach only its GDB and serial ports. The client ID and
      # audience come from the tailnet's federated identity; neither is a
      # secret, so they are repository variables.
      - name: Join tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci

      # Watch the console from before the board resets, so the boot is
      # seen; then load the firmware, which starts it.
      - name: Flash and watch the boot
        working-directory: silversat-fsw
        run: |
          python tools/flatsat.py --host flatsat console --seconds 45 \
            --expect 'SilverSat FSW starting' \
            --expect '<inf> health: boot' \
            --forbid 'FATAL ERROR' --forbid 'FAULT' --forbid ' LOW,' \
            > ../console.log 2>&1 &
          watcher=$!
          sleep 2
          python tools/flatsat.py --host flatsat flash --gdb gdb-multiarch --elf ../fw/zephyr.elf
          wait "$watcher"

      - name: Upload hardware logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flatsat-logs
          path: |
            console.log
            fw/zephyr.elf
          retention-days: 14
