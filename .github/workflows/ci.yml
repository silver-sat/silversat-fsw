name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * *'        # 02:17 ET, off the hour so it isn't queued behind everyone else's midnight jobs
  workflow_dispatch:

# Cancel only in-progress runs for pull requests, not for pushes to main or scheduled runs.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native_sim:
    name: native_sim tests
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      ZEPHYR_TOOLCHAIN_VARIANT: zephyr

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # MUST match `self: path:` in west.yml.
          path: silversat-fsw

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install 32-bit host libraries
        # Needed only for the default (32-bit) native_sim target. If this
        # ever becomes a problem, drop this step and the `-p native_sim`
        # line below, keeping native_sim/native/64.
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib

      - name: Set up Zephyr workspace
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: silversat-fsw
          # Not used by native_sim (which builds with the host compiler),
          # but cached here so the target-build job below is fast.
          toolchains: arm-zephyr-eabi

      - name: Install message generator requirements
        run: pip install -r silversat-fsw/messages/requirements.txt

      - name: Run twister
        working-directory: silversat-fsw
        run: make test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: twister-results
          path: |
            silversat-fsw/twister-out/twister.xml
            silversat-fsw/twister-out/twister.log
          retention-days: 7
          if-no-files-found: ignore

  # Coverage runs in its own job rather than inside `make test` (DS-05).
  # Coverage instrumentation slows every build and doesn't mix well with
  # the sanitizers, so `make test` stays fast and `make coverage` runs
  # here in parallel. 64-bit only, so no 32-bit host libraries needed.
  coverage:
    name: native_sim coverage
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      ZEPHYR_TOOLCHAIN_VARIANT: zephyr

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: silversat-fsw

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Zephyr workspace
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: silversat-fsw
          toolchains: arm-zephyr-eabi

      - name: Install message generator requirements
        run: pip install -r silversat-fsw/messages/requirements.txt

      - name: Run twister with coverage
        working-directory: silversat-fsw
        run: make coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: silversat-fsw/twister-out/coverage/
          retention-days: 14

  build_target:
    name: nucleo_f446re build
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: silversat-fsw

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Zephyr workspace
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: silversat-fsw
          toolchains: arm-zephyr-eabi

      - name: Install message generator requirements
        run: pip install -r silversat-fsw/messages/requirements.txt

      - name: Build application
        working-directory: silversat-fsw
        run: make build

      - name: Report footprint
        working-directory: silversat-fsw
        run: |
          arm-zephyr-eabi-size build/zephyr/zephyr.elf || \
            size build/zephyr/zephyr.elf

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: zephyr-nucleo_f446re
          path: silversat-fsw/build/zephyr/zephyr.elf
          retention-days: 7

  compliance:
    name: compliance
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: silversat-fsw
          # Compliance diffs against the base branch, so the default
          # shallow clone is not enough.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Zephyr workspace
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: silversat-fsw
          toolchains: arm-zephyr-eabi

      - name: Install compliance requirements
        run: pip install -r zephyr/scripts/requirements-compliance.txt

      - name: Run compliance checks
        working-directory: silversat-fsw
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          python ../zephyr/scripts/ci/check_compliance.py \
            -m Kconfig -m DevicetreeBindings -m DevicetreeLinting -m YAMLLint \
            -c "origin/$BASE_REF..HEAD"

  flatsat:
    name: flatsat (HIL)
    needs: [build_target]

    # Two gates. The repository variable is the master switch -- set
    # FLATSAT_ENABLED to "true" in Settings -> Secrets and variables ->
    # Actions -> Variables when the rig is up. The second condition keeps
    # fork pull requests off the hardware: a fork PR can run arbitrary
    # code, and this job holds a tailnet key.
    if: >-
      vars.FLATSAT_ENABLED == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)

    # Deliberately the OPPOSITE of the workflow-level setting: one board
    # means runs must QUEUE, not cancel each other. The group is keyed on
    # the hardware, not the branch, so every trigger shares one lane.
    concurrency:
      group: flatsat-nucleo-f446re
      cancel-in-progress: false

    # Informational until the rig has earned trust. A flaky required check
    # that blocks ten students will teach them to ignore CI. Remove this
    # line -- and add the job to the ruleset -- after a couple of weeks of
    # clean nightly runs.
    continue-on-error: true

    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: silversat-fsw

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install host-side tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gdb-multiarch
          pip install pygdbmi

      - name: Download firmware
        uses: actions/download-artifact@v7
        with:
          name: zephyr-nucleo_f446re
          path: fw

      - name: Join tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure SSH to the flatsat
        env:
          FLATSAT_SSH_KEY: ${{ secrets.FLATSAT_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$FLATSAT_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat >> ~/.ssh/config <<'EOF'
          Host flatsat
            HostName flatsat.${{ secrets.TS_TAILNET }}.ts.net
            User flatsat
            StrictHostKeyChecking accept-new
            ConnectTimeout 15
          EOF

      - name: Power-cycle the target
        run: |
          ssh flatsat 'ykushcmd ykush3 -d 1' || true
          sleep 3
          ssh flatsat 'ykushcmd ykush3 -u 1'
          sleep 5

      - name: Flash and run
        working-directory: silversat-fsw
        run: |
          python tools/hil.py \
            --elf      ../fw/zephyr.elf \
            --gdb-host flatsat --gdb-port 2331 \
            --rtt-host flatsat --rtt-port 19021 \
            --timeout  120 \
            --log      ../hil.log

      - name: Upload hardware logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flatsat-logs
          path: |
            hil.log
            fw/zephyr.elf
          retention-days: 14

      - name: Leave the target powered down
        if: always()
        run: ssh flatsat 'ykushcmd ykush3 -d 1' || true